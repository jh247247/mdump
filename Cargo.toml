[package]
name = "mdump"
version = "0.1.0"
edition = "2021"
authors = ["jh247247"]
description = "A configurable media backup tool using rclone"
license = "MIT"
repository = "https://github.com/jh247247/mdump"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.10"
walkdir = "2.3"
uuid = { version = "1.0", features = ["v4"] }
dialoguer = "0.11"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
dirs = "5.0"
gethostname = "0.4"
futures = "0.3"
num_cpus = "1.16"
portable-pty = "0.8"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1