# mdump_source.toml - Configuration file for removable media
# This file should be placed in the root of your removable media device

[source]
name = "Family_Photos_2024"
description = "Summer vacation and family events"

# Directories and files to backup from this media
paths = [
    "DCIM/Camera/",
    "Documents/Scanned/",
    "Videos/Personal/"
]

# File patterns to include (empty means include all)
file_filters = [
    "*.jpg",
    "*.jpeg", 
    "*.png",
    "*.raw",
    "*.mp4",
    "*.mov",
    "*.pdf",
    "*.docx"
]

# Patterns to exclude
exclude_patterns = [
    ".DS_Store",
    "Thumbs.db",
    "*.tmp",
    "._*"
]

# Media validation configuration (optional)
[source.validation]
enabled = true
skip_on_validation_failure = true
max_validation_time_seconds = 30

# FFprobe validation for video files
[source.validation.ffprobe_validation]
enabled = true
# ffprobe_path = "/usr/local/bin/ffprobe"  # Optional: custom ffprobe path
file_patterns = ["*.mp4", "*.mov", "*.avi", "*.mkv", "*.wmv"]  # Video file patterns
required_streams = ["video"]              # Require video stream
min_duration_seconds = 1.0                # Minimum 1 second duration
# max_duration_seconds = 3600.0          # Optional: maximum duration
check_corruption = false                  # Enable deep corruption checks

# Validate that all files are readable
[[source.validation.custom_commands]]
name = "file_readable"
command = "test"
args = ["-r", "{file_path}"]
file_patterns = ["*"]                     # Apply to all files
expected_exit_code = 0
timeout_seconds = 5

# Validate image files with ImageMagick identify
[[source.validation.custom_commands]]
name = "image_validation"
command = "identify"
args = ["{file_path}"]
file_patterns = ["*.jpg", "*.jpeg", "*.png", "*.tiff", "*.gif"]  # Image file patterns
expected_exit_code = 0
timeout_seconds = 10

