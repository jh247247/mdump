# mdump_source.toml - Insta360 X5 / GoPro HERO5 Black
# Place this file in the root of the SD card

[source]
name = "Insta360_X5"
description = "Insta360 X5 action camera footage"

# GoPro stores footage in DCIM/100GOPRO
paths = ["DCIM/100GOPRO"]

# Only backup main MP4 files
# GOPR*.MP4 = single clips and first chapter of long recordings
# GP01*.MP4 = chapter 2 of recordings that exceed ~4GB
# Excludes: *.LRV (low-res proxy), *.THM (thumbnail)
file_filters = ["*.MP4"]

exclude_patterns = [
    "*.LRV",   # Low-res proxy videos (generated by GoPro app)
    "*.THM",   # Thumbnail images
    ".DS_Store",
    "._*",
]

[source.deletion]
delete_imported_files = true
# Also clean up the proxy/thumbnail files for clips we backed up
extra_file_patterns = ["*.LRV", "*.THM"]

[source.validation]
enabled = true
skip_on_validation_failure = false
max_validation_time_seconds = 60

[source.validation.ffprobe_validation]
enabled = true
file_patterns = ["*.MP4"]
required_streams = ["video"]
min_duration_seconds = 1.0
check_corruption = false
